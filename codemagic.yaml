workflows:
  android-debug-build:
    name: Share Archive Vault - Debug Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Diagnose project structure
        script: |
          echo "=== Current directory ==="
          pwd
          ls -la
          if [ -d "share-archive-vault" ]; then
            echo "Moving files from nested directory..."
            cp -r share-archive-vault/. .
          fi

      - name: Setup Gradle
        script: |
          set -e
          echo "Downloading and installing Gradle 8.2 directly..."
          curl -sL https://services.gradle.org/distributions/gradle-8.2-bin.zip -o gradle-8.2-bin.zip
          unzip -q gradle-8.2-bin.zip
          export PATH=$PWD/gradle-8.2/bin:$PATH
          echo "Generating wrapper JAR..."
          gradle wrapper
          chmod +x gradlew

      - name: Build Debug APK
        script: |
          set -e
          export PATH=$PWD/gradle-8.2/bin:$PATH
          ./gradlew assembleDebug --stacktrace

    artifacts:
      - app/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - mrfake2340@gmail.com
        notify:
          success: true
          failure: true
