workflows:
  android-debug-build:
    name: Share Archive Vault - Debug Build
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      java: 17

    scripts:
      - name: Generate Gradle Wrapper (if missing)
        script: |
          if [ ! -f "gradlew" ]; then
            echo "gradlew not found — generating via gradle wrapper task..."
            gradle wrapper --gradle-version 8.6 --distribution-type bin
          else
            echo "gradlew already exists."
          fi

      - name: Set gradlew executable permission
        script: chmod +x gradlew

      - name: Build debug APK
        script: ./gradlew assembleDebug --stacktrace

    artifacts:
      - app/build/outputs/apk/debug/app-debug.apk

    publishing:
      email:
        recipients:
          - mrfake2340@gmail.com
        notify:
          success: true
          failure: true
