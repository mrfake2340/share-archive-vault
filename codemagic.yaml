workflows:
  android-debug-build:
    name: Share Archive Vault - Debug Build
    max_build_duration: 60
    instance_type: mac_mini_m2

    environment:
      java: 17
      vars:
        # মেমোরি ফ্ল্যাগ আলাদা ভ্যারিয়েবলে নিরাপদভাবে সেট করা হয়েছে
        GRADLE_OPTS: "-Dorg.gradle.jvmargs='-Xmx2048m -XX:MaxMetaspaceSize=512m'"

    scripts:
      - name: Diagnose project structure
        script: |
          echo "=== Current directory ==="
          pwd
          ls -la
          if [ -d "share-archive-vault" ]; then
            echo "Moving files from nested directory..."
            cp -r share-archive-vault/. .
          fi

      - name: Setup Gradle Wrapper
        script: |
          set -e
          if [ -f "gradlew" ]; then
            echo "gradlew found!"
            chmod +x gradlew
          else
            echo "gradlew not found, using global gradle to wrapper..."
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Build Debug APK
        script: |
          set -e
          ./gradlew assembleDebug --stacktrace

    artifacts:
      - app/build/outputs/apk/debug/*.apk

    publishing:
      email:
        recipients:
          - mrfake2340@gmail.com
        notify:
          success: true
          failure: true
